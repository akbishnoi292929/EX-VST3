name: Build EX VST3 Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Cache JUCE Source
      uses: actions/cache@v4
      with:
        path: JUCE
        key: juce-cache-7.0.12-${{ runner.os }}

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DJUCE_BUILD_EXTRAS=OFF
        -DJUCE_BUILD_EXAMPLES=OFF
        -G "Ninja"

    - name: Build VST3 Target Only
      run: cmake --build build --config Release --target EX_VST3 --parallel

    - name: Locate and Package VST3 Artifact
      shell: bash
      run: |
        mkdir -p dist
        VST_PATH=$(find build -name "EX.vst3" -type d | head -n 1)
        echo "Found VST3 at: $VST_PATH"
        7z a -mx=1 -tzip dist/EX-VST3-Windows-x64.zip "$VST_PATH"
        ls -lh dist/

    - name: Upload VST3 Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EX-VST3-Windows-x64
        path: dist/EX-VST3-Windows-x64.zip
        retention-days: 7
