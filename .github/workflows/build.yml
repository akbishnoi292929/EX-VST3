name: Build EX VST3 Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache JUCE Source
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-7.0.12-windows

      - name: Clone JUCE v7.0.12 (Shallow)
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DJUCE_BUILD_EXTRAS=OFF `
            -DJUCE_BUILD_EXAMPLES=OFF

      - name: Build VST3 Target Only
        run: |
          cmake --build build --config Release --target EX_VST3 --parallel 2

      - name: Locate and Package VST3 Artifact
        shell: pwsh
        run: |
          $vst3Path = Get-ChildItem -Path "build" -Recurse -Filter "EX.vst3" -Directory | Select-Object -First 1
          if (-not $vst3Path) {
            Write-Error "EX.vst3 directory not found!"
            exit 1
          }
          Write-Host "Found VST3 at: $($vst3Path.FullName)"
          Compress-Archive -Path $vst3Path.FullName -DestinationPath "EX_VST3_Windows_x64.zip" -Force

      - name: Upload VST3 Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EX-VST3-Windows-x64
          path: EX_VST3_Windows_x64.zip
          retention-days: 14
